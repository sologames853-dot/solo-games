<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Solo Games</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <h1>SOLO GAMES</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <div class="container" style="max-width: 500px;">
        <div class="form-box animate">
            <h2>Forgot Password</h2>
            <p style="text-align: center; color: var(--text-dim); margin-bottom: 30px;">Enter your email to receive a password reset OTP</p>

            <div style="position: relative; margin-bottom: 20px;">
                <i class="fas fa-envelope" style="position: absolute; left: 15px; top: 15px; color: var(--text-dim); font-size: 14px;"></i>
                <input type="email" id="email" placeholder="Email Address" style="padding-left: 45px;">
            </div>

            <button onclick="requestReset()" class="button-primary" style="width: 100%; padding: 15px; font-size: 16px; margin-top: 10px;" id="resetBtn">
                Send Reset OTP
            </button>

            <p style="text-align: center; margin-top: 25px; color: var(--text-dim); font-size: 14px;">
                Remembered? <a href="login.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Back to Login</a>
            </p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        async function requestReset() {
            const email = document.getElementById("email").value;
            const btn = document.getElementById("resetBtn");

            if (!email) {
                return alert("Please enter your email");
            }

            btn.innerText = "Sending...";
            btn.disabled = true;

            try {
                const res = await fetch(`${API_URL}/api/forgot-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email })
                });

                const result = await res.json();

                if (result.success) {
                    alert("Reset OTP sent to your email!");
                    localStorage.setItem("resetEmail", email);
                    location.href = "reset-password.html";
                } else {
                    alert(result.message);
                }
            } catch (err) {
                console.error(err);
                alert("Server Error. Please try again later.");
            } finally {
                btn.innerText = "Send Reset OTP";
                btn.disabled = false;
            }
        }
    </script>

</body>
</html>
