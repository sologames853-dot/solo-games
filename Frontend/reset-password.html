<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Solo Games</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <h1>SOLO GAMES</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <div class="container" style="max-width: 500px;">
        <div class="form-box animate">
            <h2>Reset Password</h2>
            <p style="text-align: center; color: var(--text-dim); margin-bottom: 30px;">Enter the OTP sent to your email and your new password</p>

            <div style="position: relative; margin-bottom: 15px;">
                <i class="fas fa-key" style="position: absolute; left: 15px; top: 15px; color: var(--text-dim); font-size: 14px;"></i>
                <input type="text" id="otp" placeholder="Enter OTP" style="padding-left: 45px;">
            </div>

            <div style="position: relative; margin-bottom: 15px;">
                <i class="fas fa-lock" style="position: absolute; left: 15px; top: 15px; color: var(--text-dim); font-size: 14px;"></i>
                <input type="password" id="newPassword" placeholder="New Password" style="padding-left: 45px;">
            </div>

            <button onclick="resetPassword()" class="button-primary" style="width: 100%; padding: 15px; font-size: 16px; margin-top: 10px;" id="resetBtn">
                Reset Password
            </button>

            <p style="text-align: center; margin-top: 25px; color: var(--text-dim); font-size: 14px;">
                Remembered? <a href="login.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Back to Login</a>
            </p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        async function resetPassword() {
            const email = localStorage.getItem("resetEmail");
            const otp = document.getElementById("otp").value;
            const newPassword = document.getElementById("newPassword").value;
            const btn = document.getElementById("resetBtn");

            if (!otp || !newPassword) {
                return alert("Please fill all fields");
            }

            if (!email) {
                alert("Session expired. Please request OTP again.");
                location.href = "forgot-password.html";
                return;
            }

            btn.innerText = "Reseting...";
            btn.disabled = true;

            try {
                const res = await fetch(`${API_URL}/api/reset-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, otp, newPassword })
                });

                const result = await res.json();

                if (result.success) {
                    alert("Password reset successful! You can now login.");
                    localStorage.removeItem("resetEmail");
                    location.href = "login.html";
                } else {
                    alert(result.message);
                }
            } catch (err) {
                console.error(err);
                alert("Server Error. Please try again later.");
            } finally {
                btn.innerText = "Reset Password";
                btn.disabled = false;
            }
        }
    </script>

</body>
</html>
